<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>from</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>

    </header>
    <main>
        <form>
            <label for="name"> Your name:
                <input id="name" type="text" placeholder="Your name">
            </label>
            <label for="email">Your email:
                <input id="email" type="email" placeholder="Your email">
            </label>
            <label for="Phone">Your Phone Number:
                <input id="phone" type="text" placeholder="Your Phone Number">
            </label>
            <fieldset>
                <legend>Pick One Course</legend>
                <label for="html">
                    <input type="radio" name="course" id="html">Html
                </label>
                <label for="css">
                    <input type="radio" name="course" id="css">Css
                </label>
                <label for="javascript">
                    <input type="radio" name="course" id="javascript">Javascript
                </label>
            </fieldset>
            <fieldset>
                <legend>Pick one or more Course</legend>
                <label for="html">
                    <input type="checkbox" name="course" id="html">Html
                </label>
                <label for="css">
                    <input type="checkbox" name="course" id="css">Css
                </label>
                <label for="javascript">
                    <input type="checkbox" name="course" id="javasxript">Javascript
                </label>
            </fieldset>
            <input type="reset" value="Reset">
            <input type="submit" value="Submit">
        </form>
    </main>
    <footer>

    </footer>
</body>

</html>
